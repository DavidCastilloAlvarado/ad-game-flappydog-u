name: Deploy to Cloud Run

on:
  push:
    branches: [ main ]

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  REGION: us-central1
  SERVICE_NAME: flappydog
  ARTIFACT_REGISTRY_REPO: flappydog-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GCP workflow variables
        run: |
          test -n "$PROJECT_ID" || { echo "Missing GitHub Actions variable: GCP_PROJECT_ID"; exit 1; }
          test -n "$WORKLOAD_IDENTITY_PROVIDER" || { echo "Missing GitHub Actions variable: GCP_WORKLOAD_IDENTITY_PROVIDER"; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo "Missing GitHub Actions variable: GCP_SERVICE_ACCOUNT"; exit 1; }
          case "$WORKLOAD_IDENTITY_PROVIDER" in
            *YOUR_PROJECT_NUMBER*|*YOUR_POOL*|*YOUR_PROVIDER*)
              echo "GCP_WORKLOAD_IDENTITY_PROVIDER still contains placeholder text"
              exit 1
              ;;
          esac

      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker Auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/flappydog:latest
          context: .

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/flappydog:latest
          flags: '--allow-unauthenticated'

      - name: Print URL
        run: echo "Deployed to ${{ steps.deploy.outputs.url }}"
