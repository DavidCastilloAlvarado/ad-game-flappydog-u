<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STAR STRIKER — 1986</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="cabinet">
    <div class="cabinet__top">
      <span class="cabinet__brand">NEBULA&nbsp;SYSTEMS</span>
      <span class="cabinet__model">MODEL&nbsp;SS-86</span>
    </div>

    <div class="screen" id="screen">
      <canvas id="game" width="480" height="640"></canvas>
      <div class="scanlines"></div>
      <div class="vignette"></div>
    </div>

    <div class="cabinet__bottom">
      <div class="hint">
        <span class="key">◀ ▶</span> / <span class="key">A D</span> move
        <span class="key">SPACE</span> fire
        <span class="key">P</span> pause
      </div>
      <div class="hint">INSERT COIN — FREE PLAY</div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
